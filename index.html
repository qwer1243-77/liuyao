<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六爻排盘器</title>
<style>
  :root{
    --ink:#16202b; --sub:#5a6876; --line:#cfd7df; --bg:#fff; --soft:#f4f6f9;
    --red:#b3261e; --green:#1a6b3c; --blue:#14507a; --amber:#8a5a00;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#eef1f4;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:15px; line-height:1.55; color:var(--ink);
  }
  .app{width:100%; max-width:430px; margin:0 auto; padding:12px 14px 40px;
       box-sizing:border-box; overflow-x:hidden;}
  h1{font-size:20px;margin:4px 0 2px;letter-spacing:.5px;}
  .lead{font-size:12.5px;color:var(--sub);margin:0 0 14px;}
  .card{background:var(--bg);border-radius:12px;padding:13px;margin-bottom:12px;overflow-x:auto;
        box-shadow:0 1px 3px rgba(0,0,0,.07);}
  h2{font-size:15px;margin:0 0 10px;padding-left:9px;border-left:3px solid var(--ink);line-height:1.2;}
  h2 small{font-weight:normal;color:var(--sub);font-size:11.5px;margin-left:6px;}
  label{display:block;font-size:12.5px;color:var(--sub);margin:8px 0 4px;}
  input[type=text],input[type=datetime-local],select{
    width:100%;padding:10px;font-size:15px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .row{display:flex;gap:8px;min-width:0;}
  .row>*{flex:1;min-width:0;}

  /* 摇卦输入 */
  .cast{display:flex;align-items:center;gap:6px;margin:7px 0;}
  .cast .pos{width:34px;flex:0 0 34px;font-size:13px;color:var(--sub);text-align:center;}
  .cast .btns{display:flex;gap:5px;flex:1;}
  .cast button{
    flex:1;padding:11px 0;font-size:14px;border:1px solid var(--line);background:var(--soft);
    border-radius:9px;color:var(--ink);font-family:inherit;cursor:pointer;
  }
  .cast button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .cast .res{width:56px;flex:0 0 56px;font-size:12px;text-align:center;color:var(--sub);}

  .go{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:11px;
      background:var(--ink);color:#fff;font-family:inherit;cursor:pointer;margin-top:12px;}
  .go:active{opacity:.85;}

  /* 结果 */
  .hidden{display:none;}
  .summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px;font-size:13px;}
  .summary div{min-width:0;overflow-wrap:anywhere;} .summary div span{color:var(--sub);font-size:12px;}
  .big{font-size:18px;font-weight:700;letter-spacing:.5px;text-align:center;margin:6px 0 14px;}

  table{width:100%;border-collapse:collapse;font-size:11.5px;margin:8px 0;table-layout:fixed;}
  th,td{border:1px solid var(--line);padding:5px 3px;text-align:center;vertical-align:middle;overflow-wrap:anywhere;}
  th{background:var(--soft);font-weight:600;font-size:12px;}
  td.l{text-align:left;padding-left:8px;}

  /* 爻线 */
  .yao{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:26px;vertical-align:middle;}
  .yao i{display:flex;width:100%;height:3.4px;}
  .yao i b{flex:1;background:var(--ink);}
  .yao i.yin{gap:5px;}

  .mrk{font-size:11px;color:#fff;background:var(--blue);border-radius:5px;padding:0 4px;}
  .mrk.red{background:var(--red);}
  .mrk.green{background:var(--green);}
  .mrk.amber{background:var(--amber);}

  .deriv{border-top:1px dashed var(--line);padding-top:9px;margin-top:9px;font-size:13px;}
  .deriv:first-child{border-top:none;margin-top:0;padding-top:0;}
  .deriv .hd{font-weight:600;margin-bottom:3px;}
  .deriv .ln{color:var(--sub);font-size:12px;margin:2px 0;overflow-wrap:anywhere;word-break:break-word;}
  .deriv .ln b{color:var(--ink);}
  .deriv .ln em{font-style:normal;color:var(--red);font-weight:600;}
  .deriv .ln i{font-style:normal;color:var(--green);font-weight:600;}

  .tag{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:6px;
       background:var(--soft);border:1px solid var(--line);margin-right:4px;}
  .note{font-size:12.5px;color:var(--sub);margin:8px 0 0;}
  .warn{background:#fdf4f3;border:1px solid #e0b4b0;border-radius:9px;padding:10px;
        font-size:12.5px;color:#7a1d18;margin-top:12px;}
  .ok{background:#f3faf5;border:1px solid #b3cdb9;border-radius:9px;padding:10px;
      font-size:12.5px;color:#14532d;margin-top:12px;}
  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tabs button{flex:1;padding:9px;font-size:13px;border:1px solid var(--line);
    background:#fff;border-radius:9px;font-family:inherit;color:var(--sub);cursor:pointer;}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .verdict{font-size:22px;font-weight:700;text-align:center;margin:4px 0 10px;letter-spacing:2px;}
  .report h3{font-size:13.5px;margin:14px 0 6px;padding:5px 0 5px 9px;border-left:3px solid var(--ink);background:#f4f6f9;}
  .report p{font-size:13px;margin:6px 0;line-height:1.62;}
  .wpanel{background:#f7f9fb;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin:8px 0;}
  .wpanel summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--blue);}
  .wg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px;}
  .wg label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px;}
  .wg input{width:100%;padding:6px;font-size:14px;border:1px solid var(--line);border-radius:7px;font-family:inherit;}  .rbanner{background:#fff8e6;border:1px solid #e6cf9a;border-radius:9px;padding:9px 11px;font-size:12.5px;color:#6b4e12;margin-bottom:6px;}
  .jl{font-size:12.5px;margin:4px 0;padding-left:14px;text-indent:-14px;line-height:1.45;}
  .jl.g{color:var(--green);} .jl.k{color:var(--red);} .jl.n{color:var(--sub);}
  details{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;background:#fcfdfe;}
  details summary{cursor:pointer;font-weight:600;font-size:13.5px;outline:none;}
  details[open] summary{margin-bottom:7px;}
  .kb{font-size:12.5px;color:#26313d;line-height:1.6;}
  .kb table{margin:6px 0;}
  .hrow{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border:1px solid var(--line);
        border-radius:9px;margin-bottom:7px;cursor:pointer;background:#fcfdfe;}
  .hrow:active{background:#eef2f6;}
  .hrow .hd{font-weight:600;font-size:14px;}
  .hrow .hm{font-size:11.5px;color:var(--sub);}
  .hrow .hq{font-size:12px;}
  @media print{
    body{background:#fff;padding:0;max-width:none;}
    .card{box-shadow:none;border:1px solid var(--line);}
    .noprint{display:none;}
  }
</style>

<body>

<h1>六爻排盘器<span id="ver" style="font-size:11.5px;color:#5a6876;font-weight:normal;margin-left:7px"></span></h1>
<p class="lead">只做「算」的部分：装卦、旺衰、六神、动变、伏神，并摊开每一步依据。不取用神、不下断语。</p>

<div class="card noprint">
  <h2>① 所问之事与时间</h2>
  <label>所问之事（写具体、带时限；工具会读这句话，自动判断用神）</label>
  <input type="text" id="question" placeholder="例：这个月学六爻的结果如何">
  <div class="row">
    <div>
      <label>起卦时间</label>
      <input type="datetime-local" id="when">
    </div>
    <div>
      <label>当年干支（自动，可按立春修正）</label>
      <select id="yearOverride">
        <option value="">自动</option>
      </select>
    </div>
  </div>
  <label>月建（自动按节气推算，可手动改）</label>
  <select id="monthOverride"><option value="">自动</option></select>
  <label>日辰（自动按干支循环推算，一般不用改）</label>
  <select id="dayOverride"><option value="">自动</option></select>
  <label>你要问什么（决定用神，不懂就选一项，工具会告诉你为什么）</label>
  <select id="ask">
    <option value="">（不指定，我自己判断）</option>
    <option value="妻财">求财、薪水、买卖、男问婚　→ 用神：妻财</option>
    <option value="官鬼">事业、工作、升迁、官司、女问婚　→ 用神：官鬼</option>
    <option value="父母">学业、考试、文书、房子、长辈、消息　→ 用神：父母</option>
    <option value="子孙">子女、健康、宠物、解忧　→ 用神：子孙</option>
    <option value="兄弟">合伙、竞争、借贷、破财　→ 用神：兄弟</option>
    <option value="世应">感情／关系　→ 看世应，不套六亲</option>
  </select>
  <p class="note" id="askhint" style="margin:6px 0 0"></p>
</div>

<div class="card noprint">
  <h2>② 六次摇卦<small>点数字＝背面个数</small></h2>
  <div id="casts"></div>
  <button class="go" id="run">排　盘</button>
  <p class="note">0 背＝老阴（阴，动）　1 背＝少阳（阳，静）　2 背＝少阴（阴，静）　3 背＝老阳（阳，动）</p>
</div>

<div id="out" class="hidden"></div>

<script>
/* ============ 基础数据 ============ */
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ZHI_WX={子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水'};

// 八卦：以初爻为 bit0
const TRI={7:'乾',3:'兑',5:'离',1:'震',6:'巽',2:'坎',4:'艮',0:'坤'};
const TRI_WX={乾:'金',兑:'金',离:'火',震:'木',巽:'木',坎:'水',艮:'土',坤:'土'};
const LOWER_ORDER=[7,3,5,1,6,2,4,0];

// 64卦名：[上卦][下卦在 LOWER_ORDER 中的序]
const NAMES={
 7:['乾为天','天泽履','天火同人','天雷无妄','天风姤','天水讼','天山遁','天地否'],
 3:['泽天夬','兑为泽','泽火革','泽雷随','泽风大过','泽水困','泽山咸','泽地萃'],
 5:['火天大有','火泽睽','离为火','火雷噬嗑','火风鼎','火水未济','火山旅','火地晋'],
 1:['雷天大壮','雷泽归妹','雷火丰','震为雷','雷风恒','雷水解','雷山小过','雷地豫'],
 6:['风天小畜','风泽中孚','风火家人','风雷益','巽为风','风水涣','风山渐','风地观'],
 2:['水天需','水泽节','水火既济','水雷屯','水风井','坎为水','水山蹇','水地比'],
 4:['山天大畜','山泽损','山火贲','山雷颐','山风蛊','山水蒙','艮为山','山地剥'],
 0:['地天泰','地泽临','地火明夷','地雷复','地风升','地水师','地山谦','坤为地']
};
const NAME2TRI={};
for(const u in NAMES){NAMES[u].forEach((nm,i)=>{NAME2TRI[nm]={u:+u,l:LOWER_ORDER[i]};});}

// 八宫
const PALACES=[
 {g:'乾',wx:'金',gua:['乾为天','天风姤','天山遁','天地否','风地观','山地剥','火地晋','火天大有']},
 {g:'坤',wx:'土',gua:['坤为地','地雷复','地泽临','地天泰','雷天大壮','泽天夬','水天需','水地比']},
 {g:'震',wx:'木',gua:['震为雷','雷地豫','雷水解','雷风恒','地风升','水风井','泽风大过','泽雷随']},
 {g:'巽',wx:'木',gua:['巽为风','风天小畜','风火家人','风雷益','天雷无妄','火雷噬嗑','山雷颐','山风蛊']},
 {g:'坎',wx:'水',gua:['坎为水','水泽节','水雷屯','水火既济','泽火革','雷火丰','地火明夷','地水师']},
 {g:'离',wx:'火',gua:['离为火','火山旅','火风鼎','火水未济','山水蒙','风水涣','天水讼','天火同人']},
 {g:'艮',wx:'土',gua:['艮为山','山火贲','山天大畜','山泽损','火泽睽','天泽履','风泽中孚','风山渐']},
 {g:'兑',wx:'金',gua:['兑为泽','泽水困','泽地萃','泽山咸','水山蹇','地山谦','雷山小过','雷泽归妹']}
];
const SHI_BY_IDX=[6,1,2,3,4,5,4,3];

// 纳甲
const NAJIA={
 乾:{inn:['甲子','甲寅','甲辰'],out:['壬午','壬申','壬戌']},
 坤:{inn:['乙未','乙巳','乙卯'],out:['癸丑','癸亥','癸酉']},
 震:{inn:['庚子','庚寅','庚辰'],out:['庚午','庚申','庚戌']},
 巽:{inn:['辛丑','辛亥','辛酉'],out:['辛未','辛巳','辛卯']},
 坎:{inn:['戊寅','戊辰','戊午'],out:['戊申','戊戌','戊子']},
 离:{inn:['己卯','己丑','己亥'],out:['己酉','己未','己巳']},
 艮:{inn:['丙辰','丙午','丙申'],out:['丙戌','丙子','丙寅']},
 兑:{inn:['丁巳','丁卯','丁丑'],out:['丁亥','丁酉','丁未']}
};

const SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'}; // A 生 B
const KE={木:'土',土:'水',水:'火',火:'金',金:'木'};     // A 克 B

const LIUHE={子:'丑',丑:'子',寅:'亥',亥:'寅',卯:'戌',戌:'卯',辰:'酉',酉:'辰',巳:'申',申:'巳',午:'未',未:'午'};
const LIUCHONG={子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};
const LIUSHEN=['青龙','朱雀','勾陈','螣蛇','白虎','玄武'];
const SHEN_START={'甲':0,'乙':0,'丙':1,'丁':1,'戊':2,'己':3,'庚':4,'辛':4,'壬':5,'癸':5};

const QIN_DESC={
 妻财:'钱财、薪水、实物，也代表我所享用、支配的东西',
 官鬼:'工作、职位、名分，也主压力、忧虑、官司',
 父母:'学业、知识、文书、房子、长辈',
 子孙:'子女、健康、医药、宠物、解忧',
 兄弟:'同辈、朋友、竞争者，也主分散、破耗'
};
const REL_DESC={
 回头生:'变爻回头生原爻，加分',
 回头克:'变爻回头克原爻，减分',
 化泄:'原爻去生变爻，泄气耗力',
 化耗:'原爻去克变爻，克出耗力',
 比和:'同五行，力量叠加'
};
const POSN=['初','二','三','四','五','上'];const QIN_ASK={妻财:'钱、薪水、买卖',官鬼:'工作、官司、女问婚',父母:'学业、文书、房子、长辈',子孙:'子女、健康、宠物',兄弟:'合伙、竞争、借贷'};
const QIN_ASK_MAP_FOR_UI=1;const TOPICS=[
 {k:'',   t:'（不指定）', q:''},
 {k:'财', t:'求财、薪水、买卖、男问婚', q:'妻财'},
 {k:'官', t:'事业、工作、升迁、官司、疾病、女问婚', q:'官鬼'},
 {k:'父', t:'学业、考试、文书、房子、长辈、消息', q:'父母'},
 {k:'子', t:'子女、晚辈、健康、宠物、解忧', q:'子孙'},
 {k:'兄', t:'合伙、竞争、借贷、破财', q:'兄弟'},
 {k:'感', t:'感情／关系（看世应，不套六亲）', q:'世应'}
];

/* ============ 历法 ============ */
function jdn(y,m,d){ // 公历 → 儒略日
  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
}
function dayGZ(y,m,d){
  const n=jdn(y,m,d);
  const idx=((n+49)%60+60)%60;          // 甲子=0
  return {idx, gan:GAN[idx%10], zhi:ZHI[idx%12]};
}
// 12「节」的日期（21世纪近似公式）
const JIE=[ // [月, 名称, C值, 起始月建地支]
  [1,'小寒',5.4055,'丑'],[2,'立春',3.87,'寅'],[3,'惊蛰',5.63,'卯'],[4,'清明',4.81,'辰'],
  [5,'立夏',5.52,'巳'],[6,'芒种',5.678,'午'],[7,'小暑',7.108,'未'],[8,'立秋',7.5,'申'],
  [9,'白露',7.646,'酉'],[10,'寒露',8.318,'戌'],[11,'立冬',7.438,'亥'],[12,'大雪',7.18,'子']
];
function jieDay(year,month,C){
  const Y=year%100;
  return Math.floor(Y*0.2422+C)-Math.floor(Y/4);
}
function monthZhi(y,m,d){
  const cands=[];
  for(const [mm,name,C,zhi] of JIE){
    let yy=y;
    cands.push({y:yy,m:mm,d:jieDay(yy,mm,C),zhi});
  }
  // 上一年的大雪（子月）作为兜底
  cands.push({y:y-1,m:12,d:jieDay(y-1,12,7.18),zhi:'子'});
  cands.sort((a,b)=> (a.y-b.y) || (a.m-b.m) || (a.d-b.d));
  let cur=null;
  for(const c of cands){
    const cd=jdn(c.y,c.m,c.d), td=jdn(y,m,d);
    if(cd<=td) cur=c; else break;
  }
  return cur?cur.zhi:'子';
}
function yearGZ(y,m,d){ // 以立春为界
  const lg=jdn(y,2,jieDay(y,2,3.87));
  const yy = jdn(y,m,d) < lg ? y-1 : y;
  const idx=((yy-4)%60+60)%60;
  return GAN[idx%10]+ZHI[idx%12];
}
function kongwang(dayIdx){
  const xunStart=Math.floor(dayIdx/10)*10;
  const zhi0=xunStart%12;
  return [ZHI[(zhi0+10)%12], ZHI[(zhi0+11)%12]];
}

/* ============ 六爻计算 ============ */
function wxOfZhi(z){return ZHI_WX[z];}
function qinOf(gongWx, zhiWx){
  if(zhiWx===gongWx) return '兄弟';
  if(SHENG[zhiWx]===gongWx) return '父母';   // 生我者
  if(SHENG[gongWx]===zhiWx) return '子孙';   // 我生者
  if(KE[zhiWx]===gongWx) return '官鬼';      // 克我者
  if(KE[gongWx]===zhiWx) return '妻财';      // 我克者
  return '?';
}
function wangshuai(wx, monthWx){
  if(wx===monthWx) return '旺';
  if(SHENG[monthWx]===wx) return '相';
  if(SHENG[wx]===monthWx) return '休';
  if(KE[wx]===monthWx) return '囚';
  if(KE[monthWx]===wx) return '死';
  return '?';
}
function triOf(hexName){
  const t=NAME2TRI[hexName];
  return {lower:TRI[t.l], upper:TRI[t.u], lv:t.l, uv:t.u};
}
function najiaOf(hexName){
  const {lower,upper}=triOf(hexName);
  const inn=NAJIA[lower].inn, out=NAJIA[upper].out;
  return [...inn,...out].map(s=>({gz:s, zhi:s.slice(1)}));
}
function palaceOf(hexName){
  for(let i=0;i<PALACES.length;i++){
    const p=PALACES[i], k=p.gua.indexOf(hexName);
    if(k>=0) return {palace:p.g, wx:p.wx, idx:k, gua:p.gua, shi:SHI_BY_IDX[k]};
  }
  return null;
}

/* ============ 渲染 ============ */
function yaoHtml(yang, moving){
  return `<span class="yao"><i class="${yang?'':'yin'}">${yang?'<b></b>':'<b></b><b></b>'}</i></span>`;
}
function yaoMini(yang){
  return `<span class="yao" style="width:22px"><i class="${yang?'':'yin'}">${yang?'<b></b>':'<b></b><b></b>'}</i></span>`;
}

/* ============ 输入控件 ============ */
const casts=[]; // 0..3 背数，index 0 = 初爻
let __skipSave=false;
const POS=['初','二','三','四','五','上'];

function buildCasts(){
  const box=document.getElementById('casts');
  box.innerHTML='';
  for(let i=0;i<6;i++){
    const row=document.createElement('div');
    row.className='cast';
    row.innerHTML=`<span class="pos">${POS[i]}爻</span>
      <span class="btns">${[0,1,2,3].map(n=>`<button data-i="${i}" data-n="${n}">${n}背</button>`).join('')}</span>
      <span class="res" id="res${i}"></span>`;
    box.appendChild(row);
  }
  box.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const i=+b.dataset.i, n=+b.dataset.n;
    casts[i]=n;
    [...box.querySelectorAll(`button[data-i="${i}"]`)].forEach(x=>x.classList.toggle('on', +x.dataset.n===n));
    const yang=(n===1||n===3), moving=(n===0||n===3);
    document.getElementById('res'+i).innerHTML =
      (yang?'阳':'阴') + (moving?' <span style="color:#b3261e">动</span>':'');
  });
}

function fillSelects(){
  const mo=document.getElementById('monthOverride');
  ZHI.forEach(z=>{const o=document.createElement('option');o.value=z;o.textContent=z+'月（'+ZHI_WX[z]+'）';mo.appendChild(o);});
  const dd=document.getElementById('dayOverride');
  for(let i=0;i<60;i++){const o=document.createElement('option');o.value=i;o.textContent=GAN[i%10]+ZHI[i%12]+'日';dd.appendChild(o);}
  const yy=document.getElementById('yearOverride');
  for(let i=0;i<60;i++){const o=document.createElement('option');o.value=i;o.textContent=GAN[i%10]+ZHI[i%12]+'年';yy.appendChild(o);}
}

/* ============ 主流程 ============ */
function run(){
  const out=document.getElementById('out');
  const q=document.getElementById('question').value.trim();

  // 时间
  let dt=new Date();
  const wv=document.getElementById('when').value;
  if(wv) dt=new Date(wv);
  const Y=dt.getFullYear(), M=dt.getMonth()+1, D=dt.getDate();

  const dgz=dayGZ(Y,M,D);
  const monthOpt=document.getElementById('monthOverride').value;
  const dayOpt=document.getElementById('dayOverride').value;
  const yearOpt=document.getElementById('yearOverride').value;

  const mZhi = monthOpt || monthZhi(Y,M,D);
  let dayIdx = dayOpt!==''? +dayOpt : dgz.idx;
  const dGan=GAN[dayIdx%10], dZhi=ZHI[dayIdx%12];
  const monthWx=wxOfZhi(mZhi);
  const kw=kongwang(dayIdx);

  // 本卦
  const lines=[];
  for(let i=0;i<6;i++){
    const n = casts[i]===undefined? -1 : casts[i];
    if(n<0){ alert('请把六次摇卦都填完（'+(i+1)+'/6）'); return; }
    const yang=(n===1||n===3), moving=(n===0||n===3);
    lines.push({i,yang,moving});
  }
  const lv=lines.slice(0,3).reduce((a,l,k)=>a+(l.yang?1:0)*(1<<k),0);
  const uv=lines.slice(3,6).reduce((a,l,k)=>a+(l.yang?1:0)*(1<<k),0);
  const lowerName=TRI[lv], upperName=TRI[uv];
  const lowerIdx=LOWER_ORDER.indexOf(lv);
  const benName=NAMES[uv][lowerIdx];

  // 变卦
  const blv=lines.slice(0,3).reduce((a,l,k)=>a+((l.moving?!l.yang:l.yang)?1:0)*(1<<k),0);
  const buv=lines.slice(3,6).reduce((a,l,k)=>a+((l.moving?!l.yang:l.yang)?1:0)*(1<<k),0);
  const bianLower=TRI[blv], bianUpper=TRI[buv];
  const bianLowerIdx=LOWER_ORDER.indexOf(blv);
  const bianName=NAMES[buv][bianLowerIdx];
  const hasMoving=lines.some(l=>l.moving);

  // 装卦
  const p=palaceOf(benName);
  const benNJ=najiaOf(benName);
  const bianNJ=najiaOf(bianName);
  const shiPos=p.shi, yingPos = shiPos>3 ? shiPos-3 : shiPos+3;
  const shenStart=SHEN_START[dGan];

  const L=[];
  for(let i=0;i<6;i++){
    const zhi=benNJ[i].zhi, wx=wxOfZhi(zhi);
    const qin=qinOf(p.wx,wx);
    const shen=LIUSHEN[(shenStart+i)%6];
    let sy=''; if(i+1===shiPos) sy='世'; else if(i+1===yingPos) sy='应';
    let bZhi='', bWx='', bQin='', rel='';
    if(lines[i].moving){
      bZhi=bianNJ[i].zhi; bWx=wxOfZhi(bZhi); bQin=qinOf(p.wx,bWx);
      if(bWx===wx) rel='比和';
      else if(SHENG[bWx]===wx) rel='回头生';
      else if(KE[bWx]===wx) rel='回头克';
      else if(SHENG[wx]===bWx) rel='化泄';
      else if(KE[wx]===bWx) rel='化耗';
    }
    L.push({i,yang:lines[i].yang,moving:lines[i].moving,zhi,wx,qin,shen,sy,
            bZhi,bWx,bQin,rel,ws:wangshuai(wx,monthWx),kong:kw.includes(zhi),
            bYang: lines[i].moving? !lines[i].yang : lines[i].yang});
  }

  // 伏神：本宫首卦中、本卦所缺六亲
  const fu=fushenOf(L,p);

  /* ---- 输出 ---- */
  const ask=(document.getElementById('ask')||{}).value||'';
  const focusQin = (ask && ask!=='世应') ? ask : '';
  let yongPick=null, yongHtml='';
  if(!ask){
    yongHtml='<p class="note">在上面「你要问什么」里选一项，这里会说明用神怎么定、为什么取那一爻。不选也可以，自己判断就行。</p>';
  } else if(ask==='世应'){
    yongHtml='<p>感情、关系类的问题，通常<b>不套六亲</b>，直接看世应：<b>世＝你，应＝对方</b>。世应相生相合则顺，相冲相克则反复。</p>';
  } else {
    const r=pickYongShen(L, ask, p.shi);
    yongPick=r.pick;
    const cands=L.filter(x=>x.qin===ask);
    yongHtml='<p>你问的是「'+ask+'」类的事，所以用神取 <b>'+ask+'</b>。本卦共有 '+cands.length+' 爻属'+ask+'：'
      +cands.map(x=>POS[x.i]+'爻 '+x.zhi+x.wx+'（'+x.ws+(x.moving?'，动':'')+(x.sy?'，'+x.sy:'')+'）').join('、')+'。</p>'
      +(r.pick
        ? '<p>按规则选出：<b>'+POS[r.pick.i]+'爻 '+r.pick.zhi+r.pick.wx+'</b>　理由：'+r.why+'。</p>'
        : '<p class="k">'+r.why+'。</p>')
      +'<p class="note">取用神次序：取动者 → 取临世应者 → 取旺者 → 取近世者。这是通行做法，不是铁律；你若判断不同，以你的为准。</p>';
  }

  let html='';

  html+=`<div class="card"><h2>${hasMoving?'本卦 之 变卦':'本卦（静卦）'}</h2>
    <div class="big">${benName}${hasMoving?' 之 '+bianName:''}</div>
    <div class="summary">
      <div><span>公历</span><br>${Y}-${String(M).padStart(2,'0')}-${String(D).padStart(2,'0')}</div>
      <div><span>年月</span><br>${yearOpt!==''?GAN[yearOpt%10]+ZHI[yearOpt%12]:yearGZ(Y,M,D)}年　${mZhi}月</div>
      <div><span>日辰</span><br>${dGan}${dZhi}日</div>
      <div><span>空亡</span><br>${kw[0]}、${kw[1]}</div>
      <div><span>卦宫</span><br>${p.palace}宫（${p.wx}）${['本宫','一世','二世','三世','四世','五世','游魂','归魂'][p.idx]}卦</div>
      <div><span>世应</span><br>世${POS[shiPos-1]}爻　应${POS[yingPos-1]}爻</div>
    </div>
    ${q?`<p class="note">所问：${q}</p>`:''}
  </div>`;

  // 盘
  html+=`<div class="card"><h2>卦　盘</h2>
  <table><colgroup>
    <col style="width:8%"><col style="width:14%"><col style="width:13%"><col style="width:20%">
    <col style="width:10%"><col style="width:11%"><col style="width:24%">
  </colgroup>
  <tr><th>爻</th><th>六神</th><th>本卦</th><th>六亲·地支</th><th>世应</th><th>旺衰</th><th>变卦</th></tr>`;
  for(let i=5;i>=0;i--){
    const x=L[i];
    const isFocus = focusQin && x.qin===focusQin;
    html+=`<tr${isFocus?' style="background:#f3faf5"':''}>
      <td>${POS[i]}</td>
      <td>${x.shen}</td>
      <td>${yaoMini(x.yang)}${x.moving?'<div style="font-size:9px;color:#b3261e">动</div>':''}</td>
      <td style="text-align:left;padding-left:5px">${x.qin}<div style="font-size:10.5px;color:#5a6876">${x.zhi}${x.wx}</div></td>
      <td>${x.sy?`<span class="mrk">${x.sy}</span>`:''}</td>
      <td style="font-size:11.5px">${x.ws}${x.kong?'<span style="color:#b3261e">空</span>':''}</td>

  ${fu.length?`<p class="note"><b>伏神</b>：${fu.map(f=>`${POS[f.pos-1]}爻下伏${f.qin}${f.zhi}${f.wx}`).join('；')}</p>`:''}
  </div>`;

  // 推导链
  html+=`<div class="card"><h2>推导链<small>每一步的依据，可自行验算</small></h2>`;
  for(let i=5;i>=0;i--){
    const x=L[i];
    html+=`<div class="deriv">
      <div class="hd">${POS[i]}爻　${x.shen} · ${x.qin} · ${x.zhi}${x.wx}${x.sy?' · <span class="mrk">'+x.sy+'</span>':''}</div>

      <div class="ln">六神：日干<b>${dGan}</b> &rarr; ${LIUSHEN[shenStart]}起初爻，顺数至第${i+1}位 &rarr; <b>${x.shen}</b></div>
      <div class="ln">旺衰：月建<b>${mZhi}（${monthWx}）</b>，此爻${x.wx} &rarr; ${wsReason(x.wx,monthWx)} &rarr; <b>${x.ws}</b></div>
      ${x.moving?`<div class="ln">动变：${x.yang?'阳':'阴'}动变${x.bYang?'阳':'阴'}，变出<b>${x.bZhi}${x.bWx}（${x.bQin}）</b>；${relReason(x.rel,x.wx,x.bWx)} &rarr; <em>${x.rel}</em></div>`:''}
    </div>`;
  }
  html+=`</div>`;

  // 应期候选
  html+=`<div class="card noprint"><h2>应期候选<small>先选一条爻作为用神</small></h2>
    <p class="note" style="margin:2px 0 8px">列出来的是<b>全部六爻</b>，每爻都注明了它对应的六亲。<b>★ 是规则首选的用神</b>；同一个六亲出现两次（两现）时，规则按「取动 → 取临世应 → 取旺 → 取近世」挑一个，另一个标为备选。</p>
    <select id="yqsel"><option value="">（选择用神爻）</option>${
      L.slice().reverse().map(x=>{
        const rr=pickYongShen(L, x.qin, p.shi);
        const isPick = rr.pick && rr.pick.i===x.i;
        const tag = isPick ? '　★ 首选' : '　备选';
        return '<option value="'+x.i+'">'+POS[x.i]+'爻　'+x.qin+'　'+x.zhi+x.wx+(x.moving?'（动）':'')+tag+'</option>';
      }).join('')
    }</select>
    <div id="yqout"></div>
    <p class="note">排序规则公开如下：值日 3 分、六合 2、原神值日 2、动爻值日 2、变爻值日 2、忌神受冲 2、冲空 2、填实 3、相冲 1。
    换一套优先级，排序就会变——<b>确定性来自「规则被写明」，不是来自「规则唯一」。</b></p>
  </div>`;

  // 用神说明
  html+=`<div class="card noprint"><h2>用神怎么定<small>按你选的「问什么」推给你看</small></h2>${yongHtml}</div>`;

  html+=`<div class="warn"><b>「算」的部分是确定的，「断」的部分只能参考。</b>
  排盘、旺衰、六神、动变、伏神、应期——这些是确定性规则，可以逐条验算。
  但<b>参考断语</b>用的权重是本工具自定义的，不是古法；<b>取用神</b>也取决于你真正想问什么。
  所以：<b>断语可以看，不能当结论</b>。若某条依据与你所学不符，先查该步的规则（纳甲／六亲／六神起法），再看结论。</div>`;

  if(!window.__skipSave){
    saveHistory({t:Date.now(), q:q, casts:casts.slice(0,6), ben:benName, bian:bianName, moving:hasMoving,
      date:(Y+'-'+String(M).padStart(2,'0')+'-'+String(D).padStart(2,'0')), mZhi:mZhi, dgz:(dGan+dZhi)});
  }
  // 参考断语（完整推导）
  function safeReport(qin){
    try{ return buildReport(L,p,qin,mZhi,monthWx,dZhi,benName,bianName); }
    catch(err){
      return '<p style="color:#b3261e"><b>报告生成出错</b>：'+err.message
        +'——请把这句话发给我，我来修。</p>';
    }
  }
  if(ask && ask!=='世应'){
    html+='<div class="card report"><h2>参考断语<small>四步推导 · 仅供参考</small></h2>'
      +'<div class="rbanner">下面按六爻通行规则一步步推。规则与顺序都摊开，你可以逐条验算。<b>但"偏吉／偏凶"的权重是本工具自定义的，不是古法</b>——请当参考，不要当结论。</div>'
      + (function(){ const W=loadW(); return '<details class="wpanel"><summary>调整评分权重（改完立刻重算）</summary><div class="wg">'
        +'<label>用神旺衰<input type="number" id="w_ys" step="0.5" min="0" value="'+W.ys+'"></label>'
        +'<label>变卦关系<input type="number" id="w_rel" step="0.5" min="0" value="'+W.rel+'"></label>'
        +'<label>原神<input type="number" id="w_yuan" step="0.5" min="0" value="'+W.yuan+'"></label>'
        +'<label>忌神<input type="number" id="w_ji" step="0.5" min="0" value="'+W.ji+'"></label>'
        +'<label>判吉阈值<input type="number" id="w_th" step="0.5" min="0.5" value="'+W.th+'"></label>'
        +'</div><p class="note">默认全是 1、阈值 2。想让"用神旺衰"更重就调大它的数；想更严格就调高阈值。改完自动重排，不会新增历史记录。</p></details>'; })()
      + safeReport(ask)
      +'<p class="note">换一套优先级，结论就会变。这正是"加权判断"无法自动化的原因。</p></div>';
  } else if(ask==='世应'){
    html+='<div class="card report"><h2>参考断语<small>感情／关系类</small></h2>'
      +'<div class="rbanner">这类问题不套六亲，直接看世应，不产生"偏好／偏坏"的数值判断。</div>'
      + safeReport('父母').replace(/<h3>第一步[\s\S]*?<\/h3>/,'').replace(/<h3>第二步[\s\S]*?<h3>世应<\/h3>/,'<h3>世应</h3>')
      +'</div>';
  } else {
    html+='<div class="card"><h2>参考断语</h2><p class="note">在上面「你要问什么」里选一项，这里会给出<b>第一步定用神 → 第二步看旺衰 → 第三步看生克 → 第四步看变卦 → 世应 → 综合断语 → 建议</b>的完整推导。</p></div>';
  }

  // 知识库
  html+='<div class="card noprint"><h2>六爻基础<small>点开看，不用另找资料</small></h2>'
   +'<details><summary>六亲是什么？为什么只有五类</summary><div class="kb">'
   +'<p>六亲＝<b>以「我」（卦宫五行）为中心的六种关系</b>：生我者父母、我生者子孙、克我者官鬼、我克者妻财、同我者兄弟，再加上「我」自己，共六个，故称六亲。</p>'
   +'<p>「我」就是卦宫本身，不单独挂牌，所以表里只有五类。</p>'
   +'<p><b>男女问婚取用不同</b>：男问婚取妻财（我克者＝我能支配的＝妻）；女问婚取官鬼（克我者＝克我之人＝夫）。</p>'
   +'</div></details>'
   +'<details><summary>旺相休囚死：跟「当月」比出来的名次</summary><div class="kb">'

   +'<p><b>同一个六亲出现两次时</b>：① 取动的 → ② 取临世或应的 → ③ 取旺的 → ④ 取离世爻近的。</p>'

   +'</div></details>'
   +'</div>';

  html+='<div class="card noprint"><h2>历史记录<small>存在本机，不上传</small></h2><div id="hist"></div></div>';

  out.classList.remove('hidden');

  window.__STATE={L,p,kw,mZhi,dayIdx,Y,M,D,
    dongZhi:L.filter(x=>x.moving).map(x=>x.zhi),
    bianZhi:L.filter(x=>x.moving).map(x=>x.bZhi).filter(Boolean)};
  ['w_ys','w_rel','w_yuan','w_ji','w_th'].forEach(function(id){
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener('change',function(){
      const mm=function(k){ const x=document.getElementById(k); return x?num(x.value,1):1; };
      saveW({ys:mm('w_ys'), rel:mm('w_rel'), yuan:mm('w_yuan'), ji:mm('w_ji'), th:Math.max(0.5, mm('w_th'))});
      __skipSave=true; run(); __skipSave=false;
    });
  });

  const yqsel=document.getElementById('yqsel');
  if(yqsel){
    yqsel.addEventListener('change',()=>renderYingqi(+yqsel.value));
    if(yongPick){ yqsel.value=yongPick.i; renderYingqi(yongPick.i); }
  }
  renderHighlight(L,focusQin);
  renderHistory();
  window.scrollTo({top:out.offsetTop-10,behavior:'smooth'});
}

function renderHighlight(L,qin){
  const rows=document.querySelectorAll('#out table tr');
  rows.forEach((tr,idx)=>{
    if(idx===0) return;
    const c=tr.children[3];
    if(!c) return;
    tr.style.background = (qin && c.textContent.trim().startsWith(qin)) ? '#f3faf5' : '';
  });
}


function qinReason(gw,zw){
  if(zw===gw) return '同我者';
  if(SHENG[zw]===gw) return '生我者';
  if(SHENG[gw]===zw) return '我生者';
  if(KE[zw]===gw) return '克我者';
  if(KE[gw]===zw) return '我克者';
  return '—';
}
function wsReason(wx,mwx){
  if(wx===mwx) return '与月建同气＝当令';
  if(SHENG[mwx]===wx) return '月建生它＝被当令者生';
  if(SHENG[wx]===mwx) return '它生月建＝泄气';
  if(KE[wx]===mwx) return '它克月建＝克令';
  if(KE[mwx]===wx) return '月建克它＝被令克';
  return '—';
}
function relReason(rel,wx,bwx){
  if(rel==='回头生') return `变爻${bwx}生原爻${wx}`;
  if(rel==='回头克') return `变爻${bwx}克原爻${wx}`;
  if(rel==='化泄') return `原爻${wx}生变爻${bwx}，自己耗气`;
  if(rel==='化耗') return `原爻${wx}克变爻${bwx}，克出耗力`;
  if(rel==='比和') return '同五行，力量相加';
  return '';
}

const SHEN_DESC={
 青龙:'喜顺、体面、带点好事',朱雀:'消息、口舌、文书往来',勾陈:'迟滞、拖沓、纠缠不清',

 旺:'当令，力量最足，做起来顺手',相:'被当令者所生，力量次足，有人帮衬',
 休:'泄了力，暂时歇着，使不上劲',囚:'与月令相克，被压着，勉强支撑',
 死:'被月令所克，力量最弱，硬推无用'

function buildReport(L,p,ask,mZhi,mWx,dZhi,benName,bianName){
  const r=pickYongShen(L,ask,p.shi);
  const y=r.pick;
  const R={旺:5,相:4,休:3,囚:2,死:1};
  const o=[]; const sec=t=>o.push('<h3>'+t+'</h3>'); const P=t=>o.push('<p>'+t+'</p>');
  if(!y){ P('本卦没有「'+ask+'」，用神不上卦，属伏神范畴，无法按常规推导。'); return o.join(''); }

  const cands=L.filter(x=>x.qin===ask);
  const shi=L[p.shi-1], ying=L[(p.shi>3?p.shi-3:p.shi+3)-1];

  // 一、定用神
  sec('第一步：定用神');
  P('你要问的是「'+ask+'」，用神就取 <b>'+ask+'</b>——它代表'+QIN_DESC[ask]+'。问这类事，卦里代表它的那一爻就是主角，其余都是配角。');
  P('本卦 '+ask+' '+(cands.length>1?'<b>两现</b>（出现两次）':'只出现一次，没有歧义')+'：'
    +cands.map(x=>POSN[x.i]+'爻 '+x.zhi+x.wx+(x.moving?'（动）':'')+(x.sy?'（'+x.sy+'）':'')).join('、')+'。');
  P('按取用神的次序，'+r.why+'，所以主角定为 <b>'+POSN[y.i]+'爻 '+y.zhi+y.wx+'</b>。');
  cands.filter(x=>x.i!==y.i).forEach(x=>{
    let n='另一个 '+POSN[x.i]+'爻 '+x.zhi+x.wx+' 是安静的';
    if(x.sy==='应') n+='，而且它正是应爻。虽然不当用神，但可以当「外部条件」来看——它反映你所处的环境';
    else if(R[x.ws]>=4) n+='，本身不弱，可以做一个参照：同样的东西，在另一个位置上是什么状态';
    P(n+'。');
  });
  P('用神临 <b>'+y.shen+'</b>——'+SHEN_DESC[y.shen]+'。所以这件事的性质里，带着这样一层味道。');

  // 二、旺衰
  sec('第二步：看旺衰');
  let rel = y.wx===mWx?'与月建同一个五行，属于「当令」':(SHENG[mWx]===y.wx?'月建生它':(SHENG[y.wx]===mWx?'它去生月建，力气被抽走':(KE[y.wx]===mWx?'它去克月建，等于跟当令的对着干':(KE[mWx]===y.wx?'月建克它':'无直接关系'))));
  P('先看月建。<b>'+mZhi+'月</b>属'+mWx+'，用神属'+y.wx+'，'+rel+'，所以它在当月是「<b>'+y.ws+'</b>」。');
  P('「'+y.ws+'」翻成白话：'+WS_PLAIN[y.ws]+'。');
  let dn;
  if(dZhi===y.zhi) dn='用神临日辰——它正好站在今天的日子上，等于当天有加持，力量再加一层';
  else if(LIUCHONG[dZhi]===y.zhi) dn='日辰与用神相冲——主冲动、易破散，事情容易被突然打断';
  else if(LIUHE[dZhi]===y.zhi) dn='日辰与用神相合——主牵绊、事缓，想快也快不起来';
  else dn='日辰与用神没有直接关系，这一项不加分也不减分';
  P('再看日辰。<b>'+dZhi+'日</b>，'+dn+'。');
  const strong=R[y.ws]>=4;
  let concl;
  if(strong&&dZhi===y.zhi) concl='用神既有月气、又临日辰，是它全卦最有力的时候——<b>条件不缺，底子是有的</b>';
  else if(strong) concl='用神有力——<b>底子不错，事情本身立得住</b>';
  else if(dZhi===y.zhi) concl='用神在月令里不旺，但临了日辰，<b>临时有劲，靠当下的势头撑着</b>';
  else concl='用神力弱——<b>先天不足，硬推会很吃力</b>';
  P('两样合起来：'+concl+'。');

  // 三、生克
  sec('第三步：看生克');
  const yuan=L.filter(x=>SHENG[x.wx]===y.wx);
  const ji=L.filter(x=>KE[x.wx]===y.wx);
  P('<b>生它的，叫原神</b>（'+y.wx+'由谁来生）：'+(yuan.length?'':'<b>一个都没有，不上卦</b>。'));
  if(!yuan.length) P('意味着没有任何东西在外面给它输血——<b>孤军，只能靠自己攒</b>。');
  yuan.forEach(x=>{
    let t='· '+POSN[x.i]+'爻 '+x.qin+' '+x.zhi+x.wx+'（'+x.ws+'）：'+(x.moving?'在动':'安静');
    if(x.moving&&x.rel) t+='，动化'+x.bZhi+x.bWx+'——'+REL_DESC[x.rel];
    P(t+'。');
    if(x.moving&&x.rel==='回头克') P('　它自己都被变爻克住了，<b>想帮也帮不动</b>——这是"看着有救，其实没救"的典型。');
    else if(x.moving) P('　它有动作，能主动来生用神，<b>这是加分项</b>。');
    else P('　它在位但没动，<b>帮得上，但帮不猛</b>。');
  });
  P('<b>克它的，叫忌神</b>（谁来克'+y.wx+'）：'+(ji.length?'':'<b>一个都没有，不上卦</b>。'));
  if(!ji.length) P('意味着没有明确的对立面——<b>麻烦不在外面，在你自己这边</b>。');
  ji.forEach(x=>{
    let t='· '+POSN[x.i]+'爻 '+x.qin+' '+x.zhi+x.wx+'（'+x.ws+'）：'+(x.moving?'在动':'安静');
    if(x.moving&&x.rel) t+='，动化'+x.bZhi+x.bWx+'——'+REL_DESC[x.rel];
    P(t+'。');
    if(x.moving) P('　它是动的，<b>阻力会主动找上来，躲不掉</b>。');
    else P('　它是静的，<b>阻力在位但不发动，暂时不碍事</b>。');
  });
  const ym=yuan.filter(x=>x.moving).length, jm=ji.filter(x=>x.moving).length;
  let s='小结：';
  s+= yuan.length?(ym?'原神有动，来生有力':'原神在位但安静，助而不显'):'没有原神，孤军无援';
  s+='；';
  s+= ji.length?(jm?'忌神发动，阻力明显':'忌神安静，阻力不大'):'没有忌神，无阻力';
  P(s+'。');

  // 四、变卦
  sec('第四步：看变卦');
  if(y.moving){
    P('用神在动——它会翻面，变成另一个五行，这就叫「动化」。它化出 <b>'+y.bZhi+y.bWx+'</b>（'+y.bQin+'）。');
    P('两者关系：'+REL_DESC[y.rel]+'。');
    if(y.rel==='回头克') P('这是全卦最关键的一笔。<b>用神被自己变出来的东西克住</b>——不是外面有人拦你，是事情做到一半，自己把自己拉了回来。主反复、主动摇。');
    else if(y.rel==='回头生') P('变爻回头生用神，<b>后劲是有的</b>，越往后越顺，主有人补位或条件好转。');
    else if(y.rel==='化泄') P('用神去生变爻，<b>力气往外漏</b>——不是被打断，是做完了留不下，像漏水。');
    else if(y.rel==='化耗') P('用神去克变爻，<b>克出耗力</b>——方向没错，但越使劲越亏，事倍功半。');
  } else {
    P('用神安静不动，没有变爻。<b>事情暂时不转向</b>，以本卦为主，现状就是接下来一段时间的样子。');
  }
  const movCount=L.filter(x=>x.moving).length;
  P('本卦 <b>'+benName+'</b> 说的是现在的局面，变卦 <b>'+bianName+'</b> 说的是它往哪走。'
    +'这一卦共有 <b>'+movCount+'</b> 个动爻——'+(movCount===0?'全静，局面稳定，短期内不会有大的转折':(movCount>=3?'动得多，说明变数大、事情还在剧烈变动中':'动静适中，有变化但不激烈'))+'。');

  // 五、世应
  sec('世应：你和这件事的关系');
  P('世爻 <b>'+POSN[shi.i]+'爻 '+shi.qin+' '+shi.zhi+shi.wx+'</b>（'+shi.ws+'，临'+shi.shen+'）——这是你自己在这个卦里的位置。');
  if(shi.qin!==ask){
    if(KE[shi.wx]===y.wx) P('注意：世爻的五行<b>正好克用神</b>。这是好事也是坏事——好在你想要它、会主动去抓；坏在"克"是要花力气的，世爻自己只有「'+shi.ws+'」，<b>想抓，但抓得吃力</b>。');
    else if(SHENG[shi.wx]===y.wx) P('世爻去生用神——<b>你在为这件事付出</b>，出力的是你。');
    else if(SHENG[y.wx]===shi.wx) P('用神来生世爻——<b>这件事反过来滋养你</b>，是顺的。');
    else if(KE[y.wx]===shi.wx) P('用神反过来克世爻——<b>这件事给你压力</b>，小心被它牵着走。');
  } else {
    P('世爻本身就是用神——<b>你和所问之事合为一体</b>，成败全系于你自己，没有"外力替你办"这回事。');
  }
  if(shi.moving&&shi.rel) P('世爻在动，化出 '+shi.bZhi+shi.bWx+'（'+shi.bQin+'）——'+REL_DESC[shi.rel]+'。');
  P('应爻 <b>'+POSN[ying.i]+'爻 '+ying.qin+' '+ying.zhi+ying.wx+'</b>（'+ying.ws+'）——对方，或外部环境、外部条件。');
  let sr;
  if(shi.wx===ying.wx) sr='同五行，比和——势均力敌，谁也不压谁';
  else if(SHENG[shi.wx]===ying.wx) sr='世生应——你在付出、在主动，对方是接受的一方';
  else if(SHENG[ying.wx]===shi.wx) sr='应生世——对方或环境在帮你，是顺的';
  else if(KE[shi.wx]===ying.wx) sr='世克应——你想掌控局面';
  else sr='应克世——你受对方或环境的压制';
  P('世应关系：<b>'+sr+'</b>。');
  if(KE[shi.wx]===ying.wx && R[shi.ws]<R[ying.ws])
    P('但要注意：世爻「'+shi.ws+'」、应爻「'+ying.ws+'」，<b>你弱它强，克是克不动的</b>——想掌控，实际掌控不了，只会觉得累。');
  else if(SHENG[ying.wx]===shi.wx && R[ying.ws]>=4)
    P('应爻有力又来生世，<b>外部条件是真能借上的</b>，别硬扛，去用它们。');

  // 六、关键
  sec('这个盘最关键的几点');
  const keys=[];
  keys.push((strong?'用神有力':'用神力弱')+'——'+(strong?'事情本身立得住，底子在':'条件不到位，先补条件再谈推进'));
  if(y.rel==='回头克') keys.push('用神化回头克——最大的问题是"回撤"，不是做不成，是做到一半被自己拉回来');
  else if(y.rel==='化泄') keys.push('用神化泄——做的时候投入，做完留不下，力气往外漏');
  else if(y.rel==='化耗') keys.push('用神化耗——方向对，但越使劲越亏');
  if(!yuan.length) keys.push('原神不上卦——没有外力来帮，只能靠自己攒');
  if(jm) keys.push('忌神发动——阻力是主动的，会自己找上门');
  if(KE[shi.wx]===y.wx && R[shi.ws]<R[y.ws]) keys.push('世克用神而世弱——你想抓，但力气不够');
  if(dZhi===y.zhi) keys.push('用神临日辰——眼下正是状态最好的时候，别浪费');
  keys.slice(0,3).forEach((k,i)=>P('<b>'+(i+1)+'.</b> '+k+'。'));

  // 七、综合
  sec('综合断语');
  const W=loadW();
  let g=0,b=0;
  if(strong) g+=W.ys; else b+=W.ys;
  if(y.rel==='回头生') g+=W.rel;
  if(y.rel==='回头克'||y.rel==='化泄'||y.rel==='化耗') b+=W.rel;
  if(y.kong) b+=W.rel;
  if(ym) g+=W.yuan; else if(yuan.length===0) b+=W.yuan;
  if(jm) b+=W.ji; else if(ji.length===0) g+=W.ji;
  const g1=Math.round(g*10)/10, b1=Math.round(b*10)/10;
  const d=Math.round((g-b)*10)/10;
  const lvl = d>=W.th?'偏吉':(d<=-W.th?'偏凶':'中性、需观察');
  P('倾向：<b>'+lvl+'</b>——合计 <b>'+(d>0?'+':'')+d+'</b>（加分 '+g1+'，减分 '+b1+'）');
  P('按你当前权重：用神旺衰×'+W.ys+'、变卦关系×'+W.rel+'、原神×'+W.yuan+'、忌神×'+W.ji+'，判吉阈值 ±'+W.th+'。'
    +'<b>这套权重是本工具自定的，不是古法</b>——你可以改，改了结论就变，这样至少是"可复现、可争议"的。');
  const D=DOMAIN[ask]||{};
  if(D.intro) P(D.intro);
  const pts=[];
  pts.push(strong?(D.strong||'事情本身有底子'):(D.weak||'底子偏弱，在硬撑'));
  if(y.rel==='回头克') pts.push(D.hui||'做到一半被自己拉回来，主反复');
  if(y.rel==='化泄') pts.push(D.xie||'力气外漏，做完留不下');
  if(y.rel==='化耗') pts.push(D.hao||'方向对但费力，越使劲越亏');
  if(!yuan.length) pts.push(D.noYuan||'没有外力来帮，只能靠自己');
  if(!ji.length) pts.push(D.noJi||'没有明显阻碍，主要矛盾在自己');
  if(jm) pts.push(D.jiMove||'阻力是主动的，会自己找上门');
  if(dZhi===y.zhi) pts.push('用神临日辰——眼下正是状态最好的时候，别错过这几天');
  pts.forEach(t=>P('· '+t+'。'));

  // 八、建议
  sec('可以怎么做');
  const tips=[];
  if(!strong || y.rel==='化泄' || y.rel==='化耗') tips.push('减小单次强度、拉长时间——<b>因为</b>用神本来就不旺，一次做太重只会耗光；一次做小、天天做，反而攒得住');
  if(y.rel==='回头克') tips.push('给「回撤」设防——<b>因为</b>回头克来自你自己的变爻，说明"拉回来"的力量是你自己产生的，靠意志顶不住，得靠流程：做完立刻留痕（写下来、复述一遍、马上用一次）');
  if(y.rel==='化泄') tips.push('把"学"改成"产出"——<b>因为</b>化泄是力气往外流，只有立刻转化成看得见的东西（笔记、例子、能讲给别人听的版本）才留得住');
  if(jm) tips.push('先处理阻力源，而不是加力硬顶——<b>因为</b>忌神是动的，它会自己找上来，正面顶只会两败');
  if(R[ying.ws]>=4 && R[shi.ws]<4) tips.push('借外部力量——<b>因为</b>应爻比你旺，说明外部条件（资料、环境、懂的人）比你自己硬撑更有效');
  if(strong && ym) tips.push('趁势推进——<b>因为</b>用神有力、原神又在动，这段时间的效率是最高的');
  if(dZhi===y.zhi) tips.push('就今天动手——<b>因为</b>用神临日辰，眼下是它最强的时候，过了这几天势头会落');
  if(!tips.length) tips.push('按既定节奏走，不急于求成——卦象没有明显的助力也没有明显的阻力，靠的是持续');
  tips.slice(0,3).forEach(t=>P('· '+t+'。'));
  return o.join('');
}
/* ============ 参考断语（规则化，非古法，仅供参照） ============ */
function judgeOf(L, p, ask){
  const r=pickYongShen(L, ask, p.shi);
  if(!r.pick) return {ok:false, level:'—', lines:[['k','本卦无「'+ask+'」，用神不上卦，须先看伏神；机械判断不适用。']]};
  const y=r.pick, R={旺:5,相:4,休:3,囚:2,死:1};
  const lines=[]; let good=0, bad=0;
  const add=(cls,t)=>{ lines.push([cls,t]); };

  if(R[y.ws]>=4){ add('g','用神'+POS[y.i]+'爻 '+y.zhi+y.wx+' 在月建下为「'+y.ws+'」——有力'); good++; }
  else { add('k','用神'+POS[y.i]+'爻 '+y.zhi+y.wx+' 在月建下为「'+y.ws+'」——力弱'); bad++; }

  if(y.moving){ add('n','用神发动——事在动，主快、主变'); } else { add('n','用神安静——事缓，暂无波澜'); }

  if(y.rel){
    const M={'回头生':['g','变爻生用神＝回头生，加分'],'回头克':['k','变爻克用神＝回头克，减分'],
             '化泄':['k','用神去生变爻＝泄气，耗力'],'化耗':['k','用神去克变爻＝克出，耗力'],'比和':['n','同气，力量叠加']};
    const m=M[y.rel]||['n',y.rel];
    add(m[0],'用神动化'+y.bZhi+y.bWx+'：'+m[1]);
    if(m[0]==='g') good++; else if(m[0]==='k') bad++;
  }
  if(y.kong){ add('k','用神逢空亡——主落空、暂时不实'); bad++; }

  const yuan=L.filter(x=>SHENG[x.wx]===y.wx);
  const ji=L.filter(x=>KE[x.wx]===y.wx);
  if(!yuan.length){ add('k','原神不上卦——无援手'); bad++; }
  else {
    const my=yuan.filter(x=>x.moving);
    if(my.length){ add('g','原神'+my.map(x=>POS[x.i]+'爻').join('、')+'发动，来生用神——有助力'); good++; }
    else { add('n','原神在位但安静——助而不显'); }
  }
  if(!ji.length){ add('g','忌神不上卦——无阻力'); good++; }
  else {
    const mj=ji.filter(x=>x.moving);
    if(mj.length){ add('k','忌神'+mj.map(x=>POS[x.i]+'爻').join('、')+'发动，来克用神——有阻力'); bad++; }
    else { add('n','忌神在位但安静——阻力不大'); }
  }

  const d=good-bad;
  const level = d>=2?'偏吉':(d<=-2?'偏凶':'中性/需观察');
  return {ok:true, level:level, lines:lines, pick:y, good:good, bad:bad};
}
/* ============ 取用神（按公开规则推，不替你决定） ============ */
const WS_RANK={旺:5,相:4,休:3,囚:2,死:1};
function pickYongShen(L, qin, shiPos){
  const c=L.filter(x=>x.qin===qin);
  if(!c.length) return {pick:null, why:'本卦没有这个六亲，属「用神不上卦」——要去本宫首卦里找伏神'};
  if(c.length===1) return {pick:c[0], why:'本卦此六亲只出现一次'};
  const desc='两现（'+c.map(x=>POS[x.i]+'爻').join('、')+'）';
  const mov=c.filter(x=>x.moving);
  if(mov.length===1) return {pick:mov[0], why:desc+'，按「取动者」，取 '+POS[mov[0].i]+' 爻'};
  const sy=c.filter(x=>x.sy);
  if(mov.length===0 && sy.length===1) return {pick:sy[0], why:desc+'，皆静，按「取临世应者」，取 '+POS[sy[0].i]+' 爻'};
  const sorted=c.slice().sort((a,b)=>WS_RANK[b.ws]-WS_RANK[a.ws]);
  if(WS_RANK[sorted[0].ws]>WS_RANK[sorted[1].ws])
    return {pick:sorted[0], why:desc+'，按「取旺者」，取 '+POS[sorted[0].i]+' 爻（'+sorted[0].ws+'）'};
  const near=c.slice().sort((a,b)=>Math.abs(a.i+1-shiPos)-Math.abs(b.i+1-shiPos));
  return {pick:near[0], why:desc+'，旺衰相当，按「取近世者」，取 '+POS[near[0].i]+' 爻'};
}
/* ============ 历史记录（localStorage） ============ */
const HKEY='liuyao_history_v1';
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HKEY)||'[]'); }catch(e){ return []; }
}
function saveHistory(rec){
  try{
    const arr=loadHistory();
    arr.unshift(rec);
    localStorage.setItem(HKEY, JSON.stringify(arr.slice(0,60)));
  }catch(e){}
}
function renderHistory(){
  const box=document.getElementById('hist'); if(!box) return;
  const arr=loadHistory();
  if(!arr.length){ box.innerHTML='<p class="note">还没有记录。每次排盘会自动存一条，留在本机、不上传。</p>'; return; }
  let h='';
  arr.forEach(function(r,i){
    h+='<div class="hrow" data-i="'+i+'">'
      +'<span class="hd">'+r.ben+(r.moving?' 之 '+r.bian:'')+'</span>'
      +'<span class="hm">'+r.date+'　'+r.mZhi+'月　'+r.dgz+'日　'+(r.casts||[]).join('/')+' 背</span>'
      +'<span class="hq">'+(r.q||'（未填所问之事）')+'</span></div>';
  });
  h+='<button id="hclear" style="margin-top:4px;width:100%;padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;font-family:inherit;font-size:13px;color:var(--sub);cursor:pointer">清空全部记录</button>';
  box.innerHTML=h;
  const rows=box.querySelectorAll('.hrow');
  for(let i=0;i<rows.length;i++){
    rows[i].addEventListener('click',(function(idx){ return function(){
      const r=arr[idx];
      if(!r||!r.casts||r.casts.length<6) return;
      document.getElementById('question').value=r.q||'';
      r.casts.forEach(function(n,k){
        const b=document.querySelector('button[data-i="'+k+'"][data-n="'+n+'"]');
        if(b) b.click();
      });
      window.__skipSave=true; run(); window.__skipSave=false;
    };})(i));
  }
  const c=document.getElementById('hclear');
  if(c) c.addEventListener('click',function(){ try{localStorage.removeItem(HKEY)}catch(e){} renderHistory(); });
}

/* ============ 伏神 ============ */
function fushenOf(L, p){
  const shou=p.gua[0];          // 本宫首卦（八纯卦）
  const shouNJ=najiaOf(shou);
  const present=new Set(L.map(x=>x.qin));
  const fu=[];
  for(let i=0;i<6;i++){
    const z=shouNJ[i].zhi, w=wxOfZhi(z), qn=qinOf(p.wx,w);
    if(!present.has(qn)) fu.push({pos:i+1,qin:qn,zhi:z,wx:w});
  }
  return fu;
}

/* ============ 应期候选 ============ */
function renderYingqi(idx){
  const S=window.__STATE, box=document.getElementById('yqout');
  if(!S||isNaN(idx)||idx===undefined){ if(box) box.innerHTML=''; return; }
  const y=S.L[idx];
  const base=new Date(S.Y, S.M-1, S.D);
  const rows=[];
  for(let n=0;n<=60;n++){
    const d=new Date(base.getTime()+n*86400000);
    const di=(S.dayIdx+n)%60;
    const z=ZHI[di%12], gz=GAN[di%10]+z;
    const rs=[]; let sc=0;
    const add=(name,pts)=>{ if(rs.indexOf(name)<0){rs.push(name); sc+=pts;} };
    if(z===y.zhi) add('值日（用神本气）',3);
    if(LIUHE[y.zhi]===z) add('六合',2);
    if(LIUCHONG[y.zhi]===z) add('相冲（旺则动、衰则破）',1);
    if(S.kw.indexOf(y.zhi)>=0){
      if(z===y.zhi) add('填实·出空',3);
      if(LIUCHONG[z]===y.zhi) add('冲空·出空',2);
    }
    if(SHENG[wxOfZhi(z)]===y.wx) add('原神值日（生用神）',2);
    if(S.dongZhi.indexOf(z)>=0) add('动爻值日',2);
    if(S.bianZhi.indexOf(z)>=0) add('变爻值日',2);
    if(S.L.some(x=>KE[x.wx]===y.wx && LIUCHONG[x.zhi]===z)) add('忌神受冲',2);
    if(rs.length===0) continue;
    rows.push({m:d.getMonth()+1,day:d.getDate(),gz,z,rs,sc,
      mz:monthZhi(d.getFullYear(),d.getMonth()+1,d.getDate())});
  }
  rows.sort((a,b)=> b.sc-a.sc || (a.m-b.m) || (a.day-b.day));
  let top=rows.slice(0,10);
  // 保证每一种规则至少出现一次（取最早那一条），避免低分但重要的信号被挤掉
  const seen=new Set();
  top.forEach(r=>r.rs.forEach(n=>seen.add(n)));
  rows.forEach(r=>{ r.rs.forEach(n=>{ if(!seen.has(n)){ seen.add(n); top.push(r); } }); });
  top.sort((a,b)=> b.sc-a.sc || (a.m-b.m) || (a.day-b.day));
  top=top.slice(0,12);
  box.innerHTML=`<table><colgroup><col style="width:20%"><col style="width:15%"><col style="width:12%"><col style="width:53%"></colgroup>
    <tr><th>日期</th><th>干支</th><th>月建</th><th>命中规则</th></tr>`+
    top.map(r=>`<tr><td>${r.m}/${r.day}</td><td>${r.gz}</td><td>${r.mz}月</td>
      <td style="text-align:left;font-size:10.5px">${r.rs.join('；')}　<b>${r.sc}分</b></td></tr>`).join('')+
    `</table><p class="note">同分按日期先后排。<b>只列候选，不替你拍板</b>——冲是动是破、哪条规则该压哪条，仍需你判断。</p>`;
}

/* ============ 初始化 ============ */
(function init(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  document.getElementById('when').value =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  buildCasts();
  fillSelects();
  document.getElementById('run').addEventListener('click',run);
  const askSel=document.getElementById('ask');
  const qInput=document.getElementById('question');
  const ASKMAP={妻财:'钱财、薪水、买卖',官鬼:'工作、名分、官司',父母:'学业、文书、房子、长辈',子孙:'子女、健康、解忧',兄弟:'合伙、竞争、借贷'};

  const ASK_KW={
   妻财:['钱','财','薪','工资','奖金','收入','赚','买卖','生意','投资','回款','欠款','分红','报价','月薪','薪资','提成','利润','收益','挣'],
   官鬼:['工作','职位','升职','升迁','面试','官司','诉讼','老板','上司','跳槽','求职','仕途','岗位','离职','开除','录用','编制','考编','面试官'],
   父母:['学','考','证','文书','合同','房','车','论文','长辈','父母','爷爷','奶奶','教材','课程','录取','通知','消息','快递','背书','证书','读书','知识'],
   子孙:['孩子','儿女','健康','病','身体','宠物','猫','狗','怀孕','生育','药','康','忧','烦','开解','心情','焦虑'],
   兄弟:['合伙','朋友','同辈','竞争','借钱','还钱','兄','弟','姐','妹','合作','分钱','瓜分','同事'],
   世应:['感情','恋爱','婚姻','男朋友','女朋友','老公','老婆','交往','复合','分手','喜欢','对象','暗恋','表白']
  };
  function inferQin(text){
    let best=null, bestHits=[];
    for(const k in ASK_KW){
      const hits=ASK_KW[k].filter(function(w){ return text.indexOf(w)>=0; });
      if(hits.length>bestHits.length){ best=k; bestHits=hits; }
    }
    return best ? {qin:best, hits:bestHits} : null;
  }

  function updAskHint(msg){
    const v=askSel.value, el=document.getElementById('askhint');
    if(!el) return;
    if(msg){ el.innerHTML=msg; return; }
    el.innerHTML = !v ? '' : (v==='世应'
      ? '你选的是「感情／关系」&rarr; 不套六亲，直接看世应：世是你，应是对方。'
      : '你选的是「'+ASKMAP[v]+'」&rarr; <b>用神将取 '+v+'</b>。排盘后会找出这一爻，并写明为什么取它。');
  }

  // 读「所问之事」，自动判断用神
  function autoFromQuestion(){
    const q=(qInput.value||'').trim();
    const el=document.getElementById('askhint');
    if(!q){ el.innerHTML=''; return; }
    const inf=inferQin(q);
    if(inf){
      askSel.value=inf.qin;
      const tips = (inf.qin==='世应')
        ? '判断你在问「感情／关系」，这类不套六亲，直接看世应。'
        : '判断你在问 <b>'+inf.qin+'</b> 这一类，用神将取 <b>'+inf.qin+'</b>。';
      el.innerHTML='从你写的问题里认出关键词「<b>'+inf.hits.slice(0,4).join('、')+'</b>」&rarr; '+tips
        +'<br>判断不对的话，手动改下面的选项即可。';
    } else {
      askSel.value='';
      el.innerHTML='没从这句话里认出明确的关键词（钱／工作／学业／健康／合伙／感情），请手动选下面的选项。';
    }
  }

  document.getElementById('ver').textContent='v3.0 · 缓存v11 · 11-22';
  qInput.addEventListener('input',autoFromQuestion);
  qInput.addEventListener('change',autoFromQuestion);
  askSel.addEventListener('change',function(){ updAskHint(); });
  updAskHint();
})();
</script>
